<div class="step-container">
  <div class="step-content">
    <div class="step-heading">
      <div>
        <h2>Combien de jours dure votre voyage ?</h2>
        <p class="step-subtitle">Indiquez la durée et le nombre de voyageurs.</p>
      </div>
      <span class="step-badge">Étape 1/5</span>
    </div>

    <div class="duree-selector">
      <label for="nombreJours">Nombre de jours :</label>
      <select id="nombreJours"
        [ngModel]="nombreJours"
        (ngModelChange)="nombreJoursChange.emit(+$event)">
        @for (n of jourOptions; track n) {
          <option [value]="n">{{ n }} jour{{ n > 1 ? 's' : '' }}</option>
        }
      </select>
    </div>

    <div class="duree-selector">
      <label for="nombrePersonnes">Nombre de personnes :</label>
      <select id="nombrePersonnes"
        [ngModel]="nombrePersonnes"
        (ngModelChange)="nombrePersonnesChange.emit(+$event)">
        @for (n of personnesOptions; track n) {
          <option [value]="n">{{ n }} personne{{ n > 1 ? 's' : '' }}</option>
        }
      </select>
    </div>

    <div class="duree-selector">
      <label for="dateVoyageSouhaitee">Date de départ souhaitée (optionnel) :</label>
      <input type="date" id="dateVoyageSouhaitee"
        [min]="minDate"
        [ngModel]="dateVoyageSouhaitee"
        (ngModelChange)="dateVoyageSouhaiteeChange.emit($event)">
      <small class="field-hint">Une estimation suffit, elle nous aide à mieux préparer votre devis.</small>
    </div>

    <div class="step-actions">
      <button class="btn-next" (click)="next.emit()" [disabled]="catalogLoading">
        {{ catalogLoading ? 'Chargement...' : 'Suivant' }}
      </button>
    </div>
  </div>
</div>
